name: Romantic Manhwa Shorts Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Fonts & Video Drivers
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-liberation fonts-dejavu-core ffmpeg imagemagick

    - name: Install Python Video Modules
      run: |
        pip install requests groq Pillow==9.5.0
        pip install "moviepy<2.0"
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

    - name: Generate Soundless Manhwa Video
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      run: |
        python generate_vids.py

    - name: Upload Video to YouTube Shorts
      env:
        YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
      run: |
        python upload_script.py

    - name: Save Video Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: final-soundless-short
        path: videos/*.mp4
        retention-days: 3
