name: Romantic Manhwa Shorts Pipeline

on:
  workflow_dispatch:

jobs:
  build-short:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies & Fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick fonts-liberation
        # Fix ImageMagick security policy for MoviePy text rendering
        sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!-- <policy domain="path" rights="none" pattern="@\*" -->/' /etc/ImageMagick-6/policy.xml

    - name: Install Python Video Modules
      run: |
        pip install requests groq
        pip install "moviepy<2.0" Pillow==9.5.0

    - name: Run Manhwa Generator
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      run: |
        python generate_vids.py
