name: Autonomous Manhwa Shorts Factory

on:
  workflow_dispatch:
    inputs:
      story_theme:
        description: 'Optional custom romance theme (leave blank for automatic random story)'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - 'generate_vids.py'
      - 'upload_script.py'
      - '.github/workflows/auto-upload.yml'
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Clean Stray Web-Edit Branches
      run: |
        git fetch --prune origin
        for br in $(git branch -r | grep 'origin/fast-gen-upload-' | sed 's|origin/||'); do
          git push origin --delete "$br" || true
        done

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install FFmpeg & Fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

    - name: Install Python Dependencies
      run: |
        pip install --upgrade pip
        pip install requests groq "yt-dlp[default]" numpy Pillow==9.5.0 "moviepy<2.0"
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

    - name: Clean Workspace & Generate Manhwa Short
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        CUSTOM_STORY_THEME: ${{ github.event.inputs.story_theme }}
      run: |
        rm -rf workspace videos
        python generate_vids.py

    - name: Upload to YouTube Shorts
      env:
        YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
      run: |
        python upload_script.py

    - name: Save History & Audio Cache
      if: always()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if [ -f story_history.json ]; then
          git add story_history.json
        fi
        if [ -f assets/indila_love_story_ethereal_inst_v7.mp3 ]; then
          git add assets/indila_love_story_ethereal_inst_v7.mp3
        fi
        git diff --staged --quiet || (git commit -m "chore: update story history and audio cache [skip ci]" && git pull --rebase origin main && git push) || true

    - name: Upload Video Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: generated-manhwa-short
        path: videos/*.mp4
        retention-days: 3
