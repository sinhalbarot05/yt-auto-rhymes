name: Autonomous Manhwa Shorts Factory

on:
  workflow_dispatch:
  schedule:
    # Runs automatically every day at 14:00 UTC (7:30 PM IST)
    - cron: '0 14 * * *'

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install FFmpeg & Clean English Fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

    - name: Install Python Packages & yt-dlp
      run: |
        pip install --upgrade pip
        pip install requests groq yt-dlp Pillow==9.5.0 "moviepy<2.0"
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

    - name: Generate Fresh Manhwa Video with Clean English Vector Bubbles & Pure Instrumental Music
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      run: |
        python generate_vids.py

    - name: Upload Video to YouTube Shorts
      env:
        YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
      run: |
        python upload_script.py

    - name: Persist Story History & Cached Pure Instrumental Audio Cut
      if: always()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if [ -f story_history.json ]; then
          git add story_history.json
        fi
        if [ -f assets/indila_love_story_instrumental_v2.mp3 ]; then
          git add assets/indila_love_story_instrumental_v2.mp3
        fi
        git diff --staged --quiet || git commit -m "chore: save story history and cached instrumental audio cut [skip ci]"
        git push || true

    - name: Save Video Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: generated-manhwa-short
        path: videos/*.mp4
        retention-days: 3
